[project]
name = "tui-vault"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pybind11>=3.0.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "textual>=8.2.8",
]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]


[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
